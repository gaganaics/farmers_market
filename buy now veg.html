<!DOCTYPE html>
<html lang="en">
<head>
  <title>Vegfoods Delivery Form</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <style>
    body {
      background-image: url(deliverybg.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
    }

    .logo img {
      width: 100px;
      height: 100px;
      margin: 10px;
    }

    h1 {
      font-size: 55px;
      text-align: center;
      margin-top: 0px;
    }

    .container-flex {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 20px;
      max-width: 95%;
      margin: 20px auto;
      
      background-size: cover;
      border: 2px solid black;
      border-radius: 25px;
      padding: 20px;
    }

    .innerdiv, .form {
      flex: 1 1 300px;
      min-height: 460px;
      border-radius: 25px;
      padding: 20px;
      border: 2px solid white;
      box-sizing: border-box;
    }

    .innerdiv {
      background-image: url(vehicle.webp);
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .innerdiv h1 {
      font-size: 36px;
      color: black;
    }

    .form {
      background-color: #d8f2df;
    }

    .form h1 {
      text-align: center;
      font-size: 32px;
    }

    .form input[type="text"] {
      border-radius: 8px;
      padding: 6px 10px;
      background: skyblue;
      border: none;
      width: 48%;
      margin-bottom: 10px;
    }

    .form input[type="submit"] {
      margin-top: 20px;
      border-radius: 8px;
      border: none;
      background-color: lightseagreen;
      color: white;
      padding: 10px 20px;
      float: right;
    }

    .form label {
      display: block;
      margin-top: 10px;
    }

    .form input[type="radio"] {
      margin-right: 5px;
    }

    @media screen and (max-width: 768px) {
      h1 {
        font-size: 36px;
      }

      .form input[type="text"] {
        width: 100%;
      }

      .form input[type="submit"] {
        float: none;
        width: 100%;
      }

      .container-flex {
        flex-direction: column;
        align-items: center;
      }

      .innerdiv, .form {
        width: 100%;
        min-height: auto;
      }
    }
  </style>
</head>

<body>

  <!-- 🔄 Logo -->
  <div class="logo">
    <a href="project vegitable page.html">
      <img src="logo.jpg" alt="icons">
    </a>
  </div>

  <!-- 🔠 Page Title -->
  <h1><b><u>Delivery Details</u></b></h1>

  <!-- 💡 Responsive Flex Container -->
  <div class="container-flex">

    <!-- 📷 Left Side -->
    <div class="innerdiv">
      <h1><b>Welcome</b></h1>
      <p><b>"Everything at your doorsteps"</b></p>
    </div>

    <!-- 📝 Form -->
    <div class="form">
      <h1>Details</h1>
      <form>
        <input type="text" id="fname" name="fname" placeholder="First name">
        <input type="text" id="lname" name="lname" placeholder="Last name">

        <input type="text" id="cname" name="cname" placeholder="City">
        <input type="text" id="zname" name="zname" placeholder="Zip">

        <input type="text" id="aname" name="aname" placeholder="Address">
        <input type="text" id="ename" name="ename" placeholder="Email">

        <label for="ques">Quantity:</label>
        <input type="radio" id="vehicle1" name="quantity" value="1/2 Kg">
        <label for="vehicle1">1/2 Kg</label><br>
        <input type="radio" id="vehicle2" name="quantity" value="1 Kg">
        <label for="vehicle2">1 Kg</label><br>
        <input type="radio" id="vehicle3" name="quantity" value="2 Kg">
        <label for="vehicle3">2 Kg</label><br>

        <input type="submit" value="PLACE ORDER">
      </form>
    </div>
  </div>

</body>
</html>
