<!DOCTYPE html>
<html lang="en">
<head>
  <title>Vegfoods - Contact Us</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background-image: url(contactbg.jpg);
      background-size: cover;
      background-repeat: no-repeat;
    }

    .logo {
      background: linear-gradient(90deg, rgba(249,249,249,1) 0%, rgba(57,125,68,1) 100%);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }


    .logo img {
      width: 80px;
      height: 80px;
    }

   

 .search {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
    }
    .search input {
      width: 100%;
      padding: 8px 35px 8px 10px;
      border-radius: 10px;
      border: 1px solid black;
    }

    .search img {
      position: absolute;
      top: 8px;
      right: 20px;
      width: 20px;
      height: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      background-color: #08450c;
      display: flex;
      flex-wrap: wrap;
      
    }

    li {
      margin: 0;
    }

    li a {
      display: block;
      color: white;
      padding: 15px 25px;
      text-decoration: none;
      font-size: 18px;
    }

    h1 {
      color: black;
      text-align: center;
      font-size: 40px;
      margin-top: 20px;
    }

    .main-content {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      padding: 20px;
      gap: 20px;
    }

    .contact {
      background: #7aa677;
      opacity: 0.9;
      padding: 76px;
      border-radius: 25px;
      color: white;
      max-width: 500px;
      flex: 1 1 300px;
      margin: 10px;
      text-align:center;
    }

    .contact p {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .contact img {
      width: 30px;
      height: 30px;
      vertical-align: middle;
      margin-right: 10px;
    }

    .flip-box {
      background-color: transparent;
      width: 100%;
      max-width: 600px;
      height: 400px;
      perspective: 1000px;
      flex: 1 1 300px;
      margin: 10px;
    }

    .flip-box-inner {
      position: relative;
      width: 100%;
      height: 84%;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .flip-box:hover .flip-box-inner {
      transform: rotateY(180deg);
    }

    .flip-box-front, .flip-box-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 25px;
    }

    .flip-box-front {
      background-color: #bbb;
    }

    .flip-box-front img {
      width: 100%;
      height: 100%;
      border-radius: 25px;
      object-fit: cover;
    }

    .flip-box-back {
      background-color: #555;
      color: white;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 25px;
    }

    /* ------------------------- Media Queries ------------------------- */

    /* For Tablets */
    @media (max-width: 768px) {
      .logo img {
        width: 60px;
        height: 60px;
      }

      .search input {
        padding: 8px 30px 8px 10px;
      }

      h1 {
        font-size: 32px;
      }

      .main-content {
        flex-direction: column;
        align-items: center;
        padding: 10px;
      }

      .contact, .flip-box {
        max-width: 90%;
        height: auto;
      }

      .flip-box {
        height: 300px;
      }

      .flip-box-front img {
        height: 300px;
      }
    }

    /* For Mobile */
    @media (max-width: 576px) {
      .logo img {
        width: 50px;
        height: 50px;
      }

      .search input {
        height: 35px;
        font-size: 14px;
      }

      h1 {
        font-size: 28px;
      }

      .navbar {
      margin-top: 10px;
    }

      ul {
       list-style-type: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #08450c;
    }

     .navbar li {
      display: inline-block;
    }


      li a {
        color: white;
      display: block;
      padding: 15px 20px;
      text-decoration: none;
      }

      .contact p {
        font-size: 16px;
      }

      .flip-box {
        height: 250px;
      }

      .flip-box-front img {
        height: 250px;
      }

      .main-content {
        flex-direction: column;
        align-items: center;
        padding: 10px;
      }
    }

  </style>
</head>

<body>
  <!-- 🔷 Header -->
  <div class="logo">
    <a href="index.html">
      <img src="logo.jpg" alt="Logo">
    </a>
  </div>

  <!-- 🔍 Search Bar -->
  <div class="search">
    <input type="text" placeholder="Search.....">
    <img src="search icon.jpg" alt="Search">
  </div>

  <!-- 📂 Navbar -->
  <ul class="navbar">
    <li><a href="index.html">Home</a></li>
    <li><a href="project about page.html">About</a></li>
    <li><a href="project contact page.html">Contact</a></li>
    <li><a href="overlayyyy.html">Items</a></li>
  </ul>

  <!-- 🧾 Page Title -->
  <h1><b><u>Contact Us</u></b></h1>

  <!-- 📦 Main Section -->
  <div class="main-content">
    <!-- 📞 Contact Info -->
    <div class="contact">
      <p><img src="call.png"><b>Phone:</b><br> +123-456-7890</p>
      <p><img src="email1.png"><b>Email:</b><br>fruitable@gmail.com</p>
      <p><img src="location.png"><b>Address:</b><br>123 Anywhere St., Any City</p>
    </div>

    <!-- 🗺️ Flip Box (Map) -->
    <div class="flip-box">
      <div class="flip-box-inner">
        <div class="flip-box-front">
          <img src="map.webp" alt="Map">
        </div>
        <div class="flip-box-back">
          <h2>Welcome...</h2>
          <p>Our Shop</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
